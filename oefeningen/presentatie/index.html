# Onderwerp - Journalen

Ik wil een creatieve scrapbookachtige website maken waar bezoekers verschillende journalstijlen kunnen ontdekken, inspiratie opdoen en hun eigen stijl kunnen personaliseren.
- Ik journal ook in mijn vrije tijd om mijn creativiteit te uiten
- Journalen is heel breed 
- hobby

#### Mijn belangrijkste inzicht:
Journalen is heel persoonlijk. Juist dat wil ik centraal zetten in mijn Digital Garden: bezoekers moeten niet het gevoel krijgen dat ze op een bepaalde manier moeten journalen, maar juist ontdekken wat bij hen past.
Zo krijgt jouw website niet alleen een informatieve functie, maar ook een creatieve en interactieve functie.

---

# Bullet journal
####Structuur + creativiteit.
- Patronen: Lijstjes, trackers, kalenders
- Gevoel: Overzicht en rust
- Kenmerkend: Strakke indeling en handgeschreven teksten.

<img src="presentatie-images/bulletjournal.jpg" alt="Bullet journal" width="500">
---

# Junk journal / Art journal
####Creatief combineren van materialen.
- Patronen: Collages, foto's, stickers
- Materialen: Oud papier, tijdschriften, tape.
- Gevoel: Creativiteit en herinneringen
- Kenmerkend: Knip-en-plakstijl, geen vaste regels

<img src="presentatie-images/junkjournal.jpg" alt="junkjournal" width="500">
---

# "Normal" journal
####Gedachten en gevoelens opschrijven
- Patronen: Teksten, foto's, journal prompts
- Gevoel: Rust en zelfreflectie
- Kenmerkend: Persoonlijk schrijven zonder vaste indeling.

<img src="presentatie-images/normaljournal.jpg" alt="junkjournal" width="500">
---

# Manifest journal
####Dromen en doelen visualiseren.
- Patronen: Affirmaties, visionboards, quotes.
- Gevoel: Motivatie en positiviteit.
- Kenmerkend: Persoonlijke groei en doelen.

<img src="presentatie-images/manifestjournal.jpg" alt="junkjournal" width="500">
---

# Introtekst

####Welkom bij mijn Digital Garden over journalen!
Ontdek verschillende journalstijlen, doe inspiratie op en leer hoe je op jouw eigen manier gedachten, herinneringen en ideeën kunt vastleggen.
